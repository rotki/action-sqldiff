name: Test action

# Runs the action from the pull request itself in output mode. Under pull_request the workflow
# and the action come from the PR and the token is read-only, so the job needs no write access
# and nothing the PR changes runs with one.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions: { }

jobs:
  test-action:
    name: Test action (output mode)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # list the files of the pull request

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install required
        # The runner image ships an apt index that goes stale when Ubuntu replaces a package.
        run: sudo apt-get update && sudo apt-get install -y sqlcipher sqlite3-tools

      - name: Test Local Action
        id: test-action
        uses: ./
        with:
          mode: output
          files: |
            *.db

      - name: Check the action reported a state
        if: github.event_name == 'pull_request'
        env:
          STATE: ${{ steps.test-action.outputs.state }}
        run: |
          case "$STATE" in
            diff | empty | none) echo "state: $STATE" ;;
            *)
              echo "::error::Unexpected state '$STATE'."
              exit 1
              ;;
          esac
